name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full commit SHA on main
        required: true
        type: string
      package_version:
        description: Approved package version, matching package.json
        required: true
        type: string
      confirm_publish:
        description: Publish this approved commit and version to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_PACKAGE_VERSION: ${{ inputs.package_version }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the approved source
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = SpekoAI/mastra-voice-speko
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_PUBLISH" = true
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Pin release tools and verify the package
        run: |
          npm install --global npm@11.13.0 pnpm@9.15.4 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          test "$(node --version)" = v24.16.0
          test "$(npm --version)" = 11.13.0
          test "$(pnpm --version)" = 9.15.4
          test "$(bun --version)" = 1.3.1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(process.env.EXPECTED_PACKAGE_VERSION, /^\d+\.\d+\.\d+$/);
          assert.equal(pkg.name, '@spekoai/mastra-voice');
          assert.equal(pkg.version, process.env.EXPECTED_PACKAGE_VERSION);
          assert.equal(pkg.repository.url, 'git+https://github.com/SpekoAI/mastra-voice-speko.git');
          assert.equal(pkg.publishConfig.registry, 'https://registry.npmjs.org/');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.provenance, true);
          NODE

      - name: Install the committed dependency lock
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Validate and build
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:package
          git diff --exit-code

      - name: Verify and publish the archive
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          archive="$RUNNER_TEMP/spekoai-mastra-voice-${EXPECTED_PACKAGE_VERSION}.tgz"
          tar -xOf "$archive" package/package.json > "$RUNNER_TEMP/npm-packed-package.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const expected = process.env.EXPECTED_PACKAGE_VERSION;
          const filename = `spekoai-mastra-voice-${expected}.tgz`;
          const pack = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-pack.json'), 'utf8'));
          const pkg = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-packed-package.json'), 'utf8'));
          assert.equal(pack.length, 1);
          assert.equal(pack[0].name, '@spekoai/mastra-voice');
          assert.equal(pack[0].version, expected);
          assert.equal(pack[0].filename, filename);
          assert.equal(pkg.name, '@spekoai/mastra-voice');
          assert.equal(pkg.version, expected);
          const bytes = readFileSync(join(process.env.RUNNER_TEMP, filename));
          assert.equal(pack[0].integrity, `sha512-${createHash('sha512').update(bytes).digest('base64')}`);
          console.log(`${filename} sha256:${createHash('sha256').update(bytes).digest('hex')}`);
          NODE
          npm publish "$archive" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org/
